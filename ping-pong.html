<!DOCTYPE html>
<html lang="en">
<head>

    <title>Ping Pong</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Ping Pong</h1>

    <div id="hud">

    <div id="controls">
        <button id="miBoton" type="button">Jugar</button>
    </div>

    <script src="juego.js"></script>
